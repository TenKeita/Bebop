name: Forecast on new AI tournament questions

on:
  workflow_dispatch:
  schedule:
    # Every 20 min, off the hour. Questions stay open ~1.5-3 h, so a missed run is caught by the next one.
    # Already-forecasted questions are skipped (one forecast per question).
    - cron: "7,27,47 * * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  forecast_job:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run bot (main tournament + MiniBench)
        run: uv run python main.py --mode tournament
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          # Spending controls (repository variables; defaults in config.py). Tiers: premium / standard / economy / minimal.
          BOT_TIER_MAIN: ${{ vars.BOT_TIER_MAIN }}
          BOT_TIER_MINIBENCH: ${{ vars.BOT_TIER_MINIBENCH }}
          BOT_SOFT_FLOOR_USD: ${{ vars.BOT_SOFT_FLOOR_USD }}
          BOT_HARD_FLOOR_USD: ${{ vars.BOT_HARD_FLOOR_USD }}
