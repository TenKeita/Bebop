name: Forecast on new AI tournament questions

on:
  workflow_dispatch:
  schedule:
    # Every 20 min, off the hour. Questions stay open ~1.5-3 h, so a missed run is caught by the next one.
    # Already-forecasted questions are skipped (one forecast per question).
    - cron: "7,27,47 * * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  forecast_job:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run bot (main tournament + MiniBench)
        run: uv run python main.py --mode tournament
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          # Go-live switch: scheduled runs forecast only when the repository variable BOT_LIVE is "true".
          BOT_LIVE: ${{ vars.BOT_LIVE }}
          # Spending controls (repository variables; defaults in config.py). Tiers: premium / standard / balanced / minimal.
          BOT_TIER_MAIN: ${{ vars.BOT_TIER_MAIN }}
          BOT_TIER_MINIBENCH: ${{ vars.BOT_TIER_MINIBENCH }}
          # Calibration and market-prior switches (repository variables; defaults in config.py).
          BOT_BINARY_SHIFT: ${{ vars.BOT_BINARY_SHIFT }}
          BOT_NUMERIC_FLAT_WEIGHT: ${{ vars.BOT_NUMERIC_FLAT_WEIGHT }}
          BOT_MARKET_PRIOR: ${{ vars.BOT_MARKET_PRIOR }}
          BOT_SOFT_FLOOR_USD: ${{ vars.BOT_SOFT_FLOOR_USD }}
          BOT_HARD_FLOOR_USD: ${{ vars.BOT_HARD_FLOOR_USD }}
      - name: Keep the structured forecast log (one line per question, per-model forecasts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-log-${{ github.run_id }}
          path: forecast_log/
          if-no-files-found: ignore
          retention-days: 90
