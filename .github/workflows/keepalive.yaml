name: Keep scheduled workflows alive

# GitHub disables scheduled workflows in public repositories after 60 days without repository activity. The season
# runs ~4 months, so a monthly empty commit keeps the 20-minute forecasting schedule from being switched off.
# Commits made with the built-in GITHUB_TOKEN do not trigger other workflows.
on:
  schedule:
    - cron: "17 3 1 * *"   # 03:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Empty keep-alive commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: monthly keep-alive (prevents GitHub from disabling the forecasting schedule)"
          git push
