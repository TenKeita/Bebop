name: Offline tests

# Runs the mocked end-to-end tests on every push: no secrets, no network calls to LLMs, no Metaculus access.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies (incl. dev)
        run: uv sync --locked --group dev
      - name: Run offline tests
        run: uv run python -m pytest -q tests
